name: ⚡ نشر الاتصال الفوري الدائم (phmp-realtime)

on:
  push:
    branches: [main]
    paths:
      - 'infra/cloudflare/phmp-realtime/**'
      - '.github/workflows/realtime-deploy.yml'
  workflow_dispatch:

jobs:
  deploy-realtime:
    name: نشر Worker الاتصال الفوري (Durable Object) على Cloudflare
    runs-on: ubuntu-latest
    steps:
      - name: 📥 Checkout
        uses: actions/checkout@v4

      - name: 🟢 Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: 🚀 نشر Worker (WS دائم + مخزن الطلبات)
        working-directory: infra/cloudflare/phmp-realtime
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          # wrangler@4 إلزامي: wrangler@3 كان **يتجاهل** حقل [[vpc_services]]
          # صامتاً — فينشر Worker بلا رابط PHMP فيفشل التحقق عبر الهاتف
          # (4005/503) رغم نجاح أمر النشر نفسه. wrangler@4 يسجّل الرابط
          # صراحةً (env.PHMP VPC Service في سجل النشر).
          npx --yes wrangler@4 deploy 2>&1 | tee deploy.log
          # العنوان يحمل حساباً فرعياً: phmp-realtime.<account>.workers.dev —
          # كان النمط [^.]* يتوقف عند أول نقطة فيُفشل التحقق رغم نجاح النشر
          URL=$(grep -o 'https://phmp-realtime[^ ]*\.workers\.dev' deploy.log | head -1 || true)
          echo "realtime_url=${URL}" >> $GITHUB_ENV
          # حارس انحدار: رابط VPC (PHMP) يجب أن يظهر في سجل النشر صراحةً —
          # غيابه يعني أن التحقق عبر الهاتف سيفشل (4005/503) بصمت
          if grep -q 'VPC Service' deploy.log; then
            echo "✅ رابط PHMP (VPC Service) مسجّل في النشر"
          else
            echo "❌ رابط VPC غير مسجّل في النشر — تأكد من wrangler@4 وحقل [[vpc_services]]"
            exit 1
          fi
          if [ -n "$URL" ]; then
            echo "✅ العنوان العام: $URL"
            sleep 10
            curl -sf "$URL/api/health" && echo " — health OK" || echo "⚠️ health لم يستجب بعد (سيتفعّل خلال لحظات)"
            # فحص عميق: إيقاظ الـDO والتحقق من تخزين الطلبات
            sleep 3
            curl -sf "$URL/api/health?deep=1" && echo " — deep health OK" || echo "⚠️ deep health لم يستجب بعد"
          else
            echo "❌ لم يُطبع عنوان النشر في السجل — افحص deploy.log"
            exit 1
          fi

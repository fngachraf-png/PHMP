name: 🤖 Android Release (APK موقّع)

on:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'public/**'
      - 'package.json'
      - 'capacitor.config.json'
      - '.github/workflows/android-release.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-android:
    name: بناء APK موقّع ونشر إصدار
    runs-on: ubuntu-latest
    steps:
      - name: 📥 Checkout
        uses: actions/checkout@v4

      - name: 🟢 Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: ☕ Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: 📦 بناء الواجهة
        run: |
          npm ci
          npm run build

      - name: 🤖 إضافة منصة أندرويد (Capacitor)
        run: |
          npm install --no-save @capacitor/core@6 @capacitor/cli@6 @capacitor/android@6
          npx cap add android
          npx cap sync android

      - name: 📱 ملء الشاشة 100% وإخفاء أشرطة النظام (Immersive Mode)
        run: |
          # كتابة MainActivity بوضع غامر احترافي: يملأ التطبيق شاشة الهاتف بالكامل
          # ويخفي شريط الحالة العلوي وشريط التنقل السفلي بشكل سلس، مع إعادة
          # الإخفاء تلقائياً عند استعادة التركيز (سلوك Immersive Sticky الرسمي)
          cat > android/app/src/main/java/com/phmp/pharmacare/MainActivity.java << 'JAVA'
          package com.phmp.pharmacare;

          import android.os.Bundle;
          import android.view.View;
          import android.view.WindowManager;
          import androidx.core.view.WindowCompat;
          import androidx.core.view.WindowInsetsCompat;
          import androidx.core.view.WindowInsetsControllerCompat;
          import com.getcapacitor.BridgeActivity;

          public class MainActivity extends BridgeActivity {

              @Override
              public void onCreate(Bundle savedInstanceState) {
                  super.onCreate(savedInstanceState);
                  enableImmersiveMode();
              }

              /**
               * ملء الشاشة 100%:
               * - FLAG_LAYOUT_NO_LIMITS: تمتد الواجهة خلف شريطي النظام
               * - hide(systemBars): إخفاء الشريط العلوي والسفلي
               * - BEHAVIOR_SHOW_TRANSIENT_BARS_BY_SWIPE: الظهور المؤقت بالسحب ثم الاختفاء
               */
              private void enableImmersiveMode() {
                  try {
                      android.view.Window window = getWindow();
                      window.setFlags(
                          WindowManager.LayoutParams.FLAG_LAYOUT_NO_LIMITS,
                          WindowManager.LayoutParams.FLAG_LAYOUT_NO_LIMITS
                      );
                      WindowCompat.setDecorFitsSystemWindows(window, false);
                      WindowInsetsControllerCompat controller =
                          new WindowInsetsControllerCompat(window, window.getDecorView());
                      controller.setSystemBarsBehavior(
                          WindowInsetsControllerCompat.BEHAVIOR_SHOW_TRANSIENT_BARS_BY_SWIPE
                      );
                      controller.hide(WindowInsetsCompat.Type.systemBars());
                      controller.hide(WindowInsetsCompat.Type.displayCutout());
                  } catch (Exception ignored) {
                      // التوافق مع الأجهزة القديمة: الشاشة الكاملة تبقى فعالة عبر الثيم
                  }
              }

              @Override
              public void onWindowFocusChanged(boolean hasFocus) {
                  super.onWindowFocusChanged(hasFocus);
                  // إعادة الإخفاء بسلاسة بعد أي مقاطعة (لوحة الإشعارات، الحوار...)
                  if (hasFocus) {
                      enableImmersiveMode();
                  }
              }
          }
          JAVA

          # تفعيل الشاشة الكاملة في الثيم أيضاً (دعم إضافي للأجهزة القديمة)
          STYLES="android/app/src/main/res/values/styles.xml"
          if [ -f "$STYLES" ]; then
            sed -i 's|<style name="AppTheme.NoActionBarLaunch" parent="Theme.SplashScreen">|<style name="AppTheme.NoActionBarLaunch" parent="Theme.SplashScreen">\n        <item name="android:windowFullscreen">true</item>|' "$STYLES"
            sed -i 's|<style name="AppTheme.NoActionBar" parent="Theme.AppCompat.DayNight.NoActionBar">|<style name="AppTheme.NoActionBar" parent="Theme.AppCompat.DayNight.NoActionBar">\n        <item name="android:windowFullscreen">true</item>\n        <item name="android:windowLayoutInDisplayCutoutMode">shortEdges</item>|' "$STYLES" || true
          fi

          echo "--- MainActivity (immersive) ---"
          grep -c "enableImmersiveMode" android/app/src/main/java/com/phmp/pharmacare/MainActivity.java

      - name: 🎨 نسخ الأيقونات المخصصة الكاملة (raster + adaptive + splash)
        run: |
          # 1) أيقونات raster (أندرويد < 8)
          for density in mdpi hdpi xhdpi xxhdpi xxxhdpi; do
            cp android-resources/icons/mipmap-${density}/ic_launcher.png android/app/src/main/res/mipmap-${density}/ic_launcher.png
            cp android-resources/icons/mipmap-${density}/ic_launcher.png android/app/src/main/res/mipmap-${density}/ic_launcher_round.png
          done

          # 2) الطبقة الأمامية للأيقونة التكيفية (أندرويد 8+ — السبب الجذري
          #    لعرض أيقونة كاباسيتور: mipmap-anydpi-v26 يشير إلى
          #    ic_launcher_foreground ولم يكن يُستبدَل)
          for density in mdpi hdpi xhdpi xxhdpi xxxhdpi; do
            cp android-resources/icons/mipmap-${density}/ic_launcher_foreground.png android/app/src/main/res/mipmap-${density}/ic_launcher_foreground.png
          done

          # 3) الطبقة الخلفية: لون أبيض (بدل شبكة كاباسيتور الفيكتورية)
          cat > android/app/src/main/res/values/ic_launcher_background.xml << 'XML'
          <?xml version="1.0" encoding="utf-8"?>
          <resources>
              <color name="ic_launcher_background">#FFFFFF</color>
          </resources>
          XML
          # إزالة خلفية كاباسيتور الفيكتورية غير المستعملة واستبدالها بمستطيل أبيض
          cat > android/app/src/main/res/drawable/ic_launcher_background.xml << 'XML'
          <?xml version="1.0" encoding="utf-8"?>
          <vector xmlns:android="http://schemas.android.com/apk/res/android"
              android:width="108dp" android:height="108dp"
              android:viewportWidth="108" android:viewportHeight="108">
              <path android:fillColor="#FFFFFF" android:pathData="M0,0h108v108h-108z" />
          </vector>
          XML

          # 4) ضمان ملفات anydpi-v26 (تشير إلى مواردنا)
          mkdir -p android/app/src/main/res/mipmap-anydpi-v26
          cat > android/app/src/main/res/mipmap-anydpi-v26/ic_launcher.xml << 'XML'
          <?xml version="1.0" encoding="utf-8"?>
          <adaptive-icon xmlns:android="http://schemas.android.com/apk/res/android">
              <background android:drawable="@color/ic_launcher_background"/>
              <foreground android:drawable="@mipmap/ic_launcher_foreground"/>
          </adaptive-icon>
          XML
          cp android/app/src/main/res/mipmap-anydpi-v26/ic_launcher.xml android/app/src/main/res/mipmap-anydpi-v26/ic_launcher_round.xml

          # 5) شاشة البداية بلوغو المنصة (بدل شاشة كاباسيتور) — كل الكثافات
          for folder in drawable drawable-land-mdpi drawable-land-hdpi drawable-land-xhdpi drawable-land-xxhdpi drawable-land-xxxhdpi drawable-port-mdpi drawable-port-hdpi drawable-port-xhdpi drawable-port-xxhdpi drawable-port-xxxhdpi; do
            mkdir -p android/app/src/main/res/${folder}
            cp android-resources/splash/${folder}/splash.png android/app/src/main/res/${folder}/splash.png
          done

          echo "--- التحقق: أيقونات وحجم الطبقة الأمامية ---"
          ls -la android/app/src/main/res/mipmap-xxxhdpi/ | grep ic_launcher
          file android/app/src/main/res/mipmap-xxxhdpi/ic_launcher_foreground.png

      - name: 🔐 صلاحيات الكاميرا والمايكروفون والموقع الجغرافي (تطبيق أندرويد)
        run: |
          # حقن صلاحيات المنصة في AndroidManifest — مطلوبة للمكالمات الصوتية/
          # المرئية (WebRTC) ومشاركة الموقع الجغرافي داخل التطبيق
          MANIFEST="android/app/src/main/AndroidManifest.xml"
          AFTER='android.permission.INTERNET'
          # الصلاحيات الثلاث المطلوبة + إعدادات الصوت + الموقع (دقيق + تقريبي)
          for PERM in "android.permission.CAMERA" "android.permission.RECORD_AUDIO" "android.permission.MODIFY_AUDIO_SETTINGS" "android.permission.ACCESS_FINE_LOCATION" "android.permission.ACCESS_COARSE_LOCATION"; do
            grep -q "android:name=\"$PERM\"" "$MANIFEST" || sed -i "s|<uses-permission android:name=\"$AFTER\" />|<uses-permission android:name=\"$AFTER\" />\n    <uses-permission android:name=\"$PERM\" />|" "$MANIFEST"
          done
          # uses-feature اختيارية: التطبيق يُثبَّت على كل الأجهزة حتى بلا كاميرا/موقع
          grep -q "android.hardware.camera" "$MANIFEST" || sed -i 's|</manifest>|    <uses-feature android:name="android.hardware.camera" android:required="false" />\n    <uses-feature android:name="android.hardware.camera.autofocus" android:required="false" />\n    <uses-feature android:name="android.hardware.location" android:required="false" />\n    <uses-feature android:name="android.hardware.microphone" android:required="false" />\n</manifest>|' "$MANIFEST"

          echo "--- AndroidManifest (الصلاحيات) ---"
          grep "uses-permission\|uses-feature" "$MANIFEST"

      - name: 🔐 فك شهادة التوقيع
        run: |
          echo "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | base64 -d > android/app/release.keystore

      - name: ⚙️ ضخ إعدادات التوقيع في build.gradle
        run: |
          # 1) إضافة كتلة signingConfigs داخل android { ... }
          sed -i 's/^android {$/android {\n    signingConfigs {\n        release {\n            storeFile file("release.keystore")\n            storePassword System.getenv("KEYSTORE_PASSWORD")\n            keyAlias System.getenv("KEY_ALIAS")\n            keyPassword System.getenv("KEY_PASSWORD")\n        }\n    }/' android/app/build.gradle

          # 2) إدراج signingConfig داخل buildTypes { release { ... } } فقط
          #    (awk يضمن عدم اللمس الساذج لكتلة signingConfigs التي تحمل نفس المسافة البادئة)
          awk '
            /buildTypes \{/ { inbuild = 1 }
            inbuild && /^        release \{/ && !done {
              print
              print "            signingConfig signingConfigs.release"
              done = 1
              next
            }
            { print }
          ' android/app/build.gradle > build_gradle.tmp && mv build_gradle.tmp android/app/build.gradle

          echo "--- signing configs (verification) ---"
          grep -A 8 'signingConfigs' android/app/build.gradle | head -10
          echo "--- buildTypes (verification) ---"
          grep -A 4 'buildTypes' android/app/build.gradle | head -6

      - name: 🔨 بناء APK الموقّع
        working-directory: android
        env:
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon -x lint

      - name: 📋 فحص توقيع APK
        run: |
          $ANDROID_HOME/build-tools/34.0.0/apksigner verify --print-certs \
            android/app/build/outputs/apk/release/app-release.apk | head -5

      - name: 🏷️ إعداد رقم الإصدار
        id: version
        run: |
          VERSION=$(node -p "require('./package.json').version")
          TAG="v${VERSION}-b${GITHUB_RUN_NUMBER}"
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "tag=$TAG" >> $GITHUB_OUTPUT
          echo "الإصدار: $TAG"

      - name: 📦 تجهيز ملف التوزيع
        run: |
          cp android/app/build/outputs/apk/release/app-release.apk PHMP.apk
          sha256sum PHMP.apk > PHMP.apk.sha256
          ls -lh PHMP.apk

      - name: 🚀 نشر إصدار GitHub (رابط التحميل الدائم)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: "منصة نظام إدارة الصيدلية فارماسي ماناجمنت پلاتفورم PHMP ${{ steps.version.outputs.tag }}"
          body: |
            # 📱 منصة نظام إدارة الصيدلية فارماسي ماناجمنت پلاتفورم PHMP — إصدار أندرويد ${{ steps.version.outputs.tag }}

            **التوقيع**: CN=TARIK CHOUIKA (شهادة صلاحيتها 30 سنة)

            ## ⬇️ التحميل المباشر العام (دائم — يحمل دائماً أحدث إصدار)
            ```
            https://phmp-download.pages.dev/PHMP.apk
            ```

            > رابط GitHub (لأعضاء المستودع):
            > `https://github.com/fngachraf-png/PHMP/releases/latest/download/PHMP.apk`

            ## ✨ مستجدات هذا الإصدار
            - 🇫🇷 اللغة الفرنسية كاملة (عربي / فرنسي / إنجليزي)
            - 🛒 واجهة الزبون: اختيار الصيدلية وطلب الدواء
            - 👤 زبون عابر أو مشترك (تسجيل بالاسم + الهاتف + صورة وثيقة الهوية)
            - ⚕️ إرفاق صورة الوصفة الطبية إلزامياً للأدوية المقيدة
            - 🚚 خيارات التوصيل (بنفسه أو عبر الصيدلية — المصاريف على الزبون)
            - 🔗 اتصال مباشر زبون ↔ كاشير/صيدلاني عبر المنصة (بدون تسجيل في الخادم)
            - 🧾 فاتورة طباعة: اسم الصيدلية + الدواء + السعر + طريقة الدفع
            - 📱 ملء الشاشة 100% وإخفاء أشرطة نظام أندرويد (Immersive)
            - نظام صلاحيات متكامل: مالك المنصة / مدير / محاسب / صيدلاني / كاشير
            - المراجع القانونية واللوائح المغربية للأدوية (AMMPS / وزارة الصحة)
            - دعم المزامنة مع قاعدة البيانات المحلية SQLite عبر النفق الدائم

            ## 🔧 التثبيت
            1. حمّل ملف `PHMP.apk`
            2. فعّل "التثبيت من مصادر غير معروفة" في هاتفك إن طُلب
            3. ثبّت وافتح التطبيق
          files: |
            PHMP.apk
            PHMP.apk.sha256
          make_latest: true

      # =====================================================================
      # نشر APK على Cloudflare Pages (رابط عام دائم — المستودع خاص فرابط
      # releases/latest يطلب توثيقاً؛ هذا الرابط عام لكل الزبناء دائماً)
      # =====================================================================
      - name: 🌐 نشر رابط التحميل العام الدائم (Cloudflare Pages)
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          mkdir -p apk-public
          cp PHMP.apk apk-public/
          cp PHMP.apk.sha256 apk-public/ 2>/dev/null || true
          cat > apk-public/index.html << 'HTML'
          <!doctype html>
          <html lang="ar" dir="rtl">
          <head>
            <meta charset="UTF-8" />
            <meta name="viewport" content="width=device-width, initial-scale=1.0" />
            <title>منصة نظام إدارة الصيدلية فارماسي ماناجمنت پلاتفورم PHMP — تحميل التطبيق</title>
            <style>
              body { font-family: system-ui, 'Segoe UI', Tahoma, sans-serif; background: linear-gradient(135deg,#ecfdf5,#d1fae5); min-height: 100vh; display: flex; align-items: center; justify-content: center; margin: 0; }
              .card { background: #fff; border-radius: 24px; box-shadow: 0 20px 50px rgba(5,150,105,.25); padding: 40px; text-align: center; max-width: 420px; }
              .logo { width: 72px; height: 72px; border-radius: 20px; background: linear-gradient(135deg,#10b981,#047857); display: flex; align-items: center; justify-content: center; font-size: 36px; margin: 0 auto 16px; }
              h1 { color: #065f46; font-size: 22px; margin: 0 0 6px; }
              p { color: #4b5563; font-size: 14px; margin: 4px 0 18px; }
              a.btn { display: inline-block; background: #059669; color: #fff; text-decoration: none; font-weight: 700; padding: 14px 32px; border-radius: 14px; font-size: 16px; box-shadow: 0 8px 20px rgba(5,150,105,.35); }
              a.btn:active { transform: scale(.97); }
              small { color: #9ca3af; display: block; margin-top: 14px; }
            </style>
          </head>
          <body>
            <div class="card">
              <div class="logo">💊</div>
              <h1>منصة PHMP</h1>
              <p>تطبيق إدارة الصيدليات وشراء الدواء<br/>وقّع بشهادة CN=TARIK CHOUIKA (30 سنة)</p>
              <a class="btn" href="/PHMP.apk">⬇️ تحميل آخر إصدار (APK)</a>
              <small>هذا الرابط يقدم دائماً أحدث إصدار تلقائياً</small>
            </div>
          </body>
          </html>
          HTML
          npx --yes wrangler@3 pages project create phmp-download --production-branch main 2>/dev/null || echo "ℹ️ المشروع موجود مسبقاً"
          npx --yes wrangler@3 pages deploy apk-public --project-name=phmp-download --branch=main --commit-dirty=true
          echo "🌐 الرابط العام الدائم: https://phmp-download.pages.dev/PHMP.apk"

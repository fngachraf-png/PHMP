name: 🚀 Deploy Cloudflare Pages

on:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'public/**'
      - 'index.html'
      - 'package.json'
      - '.github/workflows/deploy-cloudflare.yml'
  workflow_dispatch:

jobs:
  deploy:
    name: نشر الواجهة على phmp.pages.dev
    runs-on: ubuntu-latest
    steps:
      - name: 📥 Checkout
        uses: actions/checkout@v4

      - name: 🟢 Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: 📦 بناء الواجهة
        run: |
          npm ci
          npm run build

      - name: 🚀 النشر على Cloudflare Pages
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy dist --project-name=phmp --branch=main --commit-dirty=true

      - name: ✅ رابط النشر
        run: |
          echo "🌐 https://phmp.pages.dev"
          echo "alias: https://main.phmp.pages.dev"

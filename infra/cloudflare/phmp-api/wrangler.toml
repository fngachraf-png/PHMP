# PHMP — بوابة API العامة عبر Workers VPC إلى خادم الهاتف خلف النفق
# العنوان الثابت: https://phmp-api.balbolghol-ai.workers.dev
# الخدمة: phmp-app (VPC) → نفق phmp-api → 127.0.0.1:3001
name = "phmp-api"
main = "src/index.js"

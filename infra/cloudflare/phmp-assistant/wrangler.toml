# =====================================================================
# Worker «مساعد PHMP» — نموذج لغوي مجاني من Cloudflare Workers AI
# ---------------------------------------------------------------------
# النشر يتم عبر سير GitHub Actions (assistant-deploy.yml) الذي يمرر
# CLOUDFLARE_API_TOKEN و CLOUDFLARE_ACCOUNT_ID من أسرار المستودع —
# لا تُكتب أي قيم سرية هنا.
# =====================================================================

name = "phmp-assistant"
main = "src/index.js"
compatibility_date = "2024-12-01"

# ربط Workers AI — الحصة المجانية اليومية تكفي لاستخدام المساعد
[ai]
binding = "AI"

# النموذج الافتراضي (من النماذج المجانية في كلاودفلير):
#   @cf/meta/llama-3.1-8b-instruct-fast  — جودة عربية جيدة (الافتراضي)
#   @cf/meta/llama-3.2-3b-instruct-fast  — أخف وأرخص بالنيورونات
# يمكن تغييره عبر متغير بيئة AI_MODEL عند النشر دون تعديل الكود.
[vars]
# AI_MODEL = "@cf/meta/llama-3.2-3b-instruct-fast"
